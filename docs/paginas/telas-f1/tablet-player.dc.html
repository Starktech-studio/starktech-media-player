<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 800}}'>
class Component extends DCLogic {
componentDidMount() { this.agendar(); }
componentWillUnmount() { clearTimeout(this.t); }
agendar() { clearTimeout(this.t); this.t = setTimeout(() => this.setState({ oculto: true }), 5000); }
renderVals() {
const s = this.state || {};
const cap = s.cap !== false;
return {
 visivel: !s.oculto,
 capitulos: cap,
 capStyle: cap ? 'background: #2563eb; color: #ffffff' : 'background: rgba(255,255,255,0.08); color: #ffffff',
 mostrar: () => { this.setState({ oculto: !s.oculto ? true : false }); if (s.oculto) this.agendar(); },
 alternarCapitulos: () => { this.setState({ cap: !cap }); this.agendar(); }
};
}
}
</script>
